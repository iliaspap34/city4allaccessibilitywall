<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City4All Accessible Wall</title>

  <style>
    :root {
      --gutter: 2rem;
      --card-gap: 1.25rem;
      --indigo-600: #4f46e5;
      --indigo-400: #818cf8;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
    }
    @media (max-width: 640px) {
      :root { --gutter: 1rem; }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: var(--slate-900);
    }
    body.modal-open { overflow: hidden; }

    /* ---------------------------- Wall layout ---------------------------- */
    .wall {
      width: 100%;
      padding: 2.5rem 0;
      background: linear-gradient(to bottom, #f8fafc, #f1f5f9);
    }
    .wall__header { padding: 0 var(--gutter); margin-bottom: 1.5rem; }
    .wall__title { margin: 0; font-size: 1.75rem; font-weight: 800; }
    .wall__subtitle { margin: .35rem 0 0; max-width: 42rem; color: var(--slate-600); }

    /* ------------------------ Horizontal carousel ------------------------ */
    .carousel {
      display: flex;
      gap: var(--card-gap);
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      padding: .5rem var(--gutter) 1rem;
    }
    .carousel::after { content: ""; flex: 0 0 1px; }

    /* ------------------------------- Cards ------------------------------- */
    .card {
      display: flex;
      flex: 0 0 22rem;
      width: 22rem;
      height: 10rem;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 4px 10px rgba(15, 23, 42, .10), 0 0 0 1px var(--slate-200);
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      scroll-snap-align: start;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, .18), 0 0 0 1px var(--slate-200);
    }
    .card:focus-visible { outline: 4px solid var(--indigo-400); outline-offset: 2px; }

    .card__body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
    }
    .card__title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card__tagline {
      margin: .3rem 0 0;
      font-size: .875rem;
      color: var(--slate-600);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card__cta { font-size: .875rem; font-weight: 600; color: var(--indigo-600); }
    .card:hover .card__cta { color: #3730a3; }

    /* --------------------- Image slideshow (fade) ------------------------ */
    .slideshow {
      position: relative;
      flex: 0 0 9rem;
      width: 9rem;
      height: 100%;
      overflow: hidden;
      background: var(--slate-200);
    }
    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .slide.is-active { opacity: 1; }
    .slideshow--empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--indigo-400);
      background: linear-gradient(135deg, #e0e7ff, #e0f2fe);
    }

    /* ---------------------- "Add your business" card --------------------- */
    .card--add {
      position: relative;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #c026d3);
      box-shadow: 0 10px 24px rgba(79, 70, 229, .35);
      scroll-snap-align: end;
    }
    .card--add:hover { box-shadow: 0 18px 34px rgba(79, 70, 229, .45); }
    .card--add:focus-visible { outline-color: #f0abfc; }
    .card--add::before,
    .card--add::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .10);
      pointer-events: none;
    }
    .card--add::before { width: 8rem; height: 8rem; right: -2rem; top: -2rem; }
    .card--add::after { width: 6rem; height: 6rem; right: 2.5rem; bottom: -2.5rem; }
    .card--add > * { position: relative; }
    .badge {
      display: inline-block;
      padding: .15rem .75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .card--add .card__title {
      margin-top: .6rem;
      white-space: normal;
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .card--add .card__cta { color: #fff; }

    /* --------------------------- Loading skeleton ------------------------ */
    .card--skeleton { cursor: default; animation: pulse 1.5s ease-in-out infinite; }
    .card--skeleton:hover { transform: none; }
    .sk-img { flex: 0 0 9rem; background: var(--slate-200); }
    .sk-lines { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .sk-line { height: .75rem; border-radius: .25rem; background: #f1f5f9; }
    .sk-line--title { height: 1rem; width: 75%; background: var(--slate-200); }
    .sk-line--short { width: 65%; }
    @keyframes pulse { 50% { opacity: .5; } }

    /* ------------------------ Status / error / empty --------------------- */
    .status {
      margin: 0 var(--gutter) 1rem;
      padding: 1.25rem 1.5rem;
      border-radius: 1rem;
    }
    .status p { margin: 0; }
    .status--error { background: #fef2f2; color: #991b1b; box-shadow: 0 0 0 1px #fecaca; }
    .status--error .status__title { font-weight: 700; }
    .status--error .status__msg { margin-top: .4rem; font-size: .875rem; color: #b91c1c; }
    .status--empty { background: #fff; color: var(--slate-600); box-shadow: 0 0 0 1px var(--slate-200); }
    .btn-retry {
      margin-top: .9rem;
      padding: .5rem 1rem;
      border: 0;
      border-radius: .5rem;
      background: #dc2626;
      color: #fff;
      font: inherit;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-retry:hover { background: #b91c1c; }
    .btn-retry:focus-visible { outline: 4px solid #fca5a5; outline-offset: 2px; }

    /* -------------------------------- Modal ------------------------------ */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .75rem;
      background: rgba(15, 23, 42, .70);
      backdrop-filter: blur(4px);
    }
    @media (min-width: 640px) { .modal { padding: 1.5rem; } }

    .modal__dialog {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 72rem;
      max-height: 100%;
      overflow: hidden;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
    }
    @media (min-width: 1024px) { .modal__dialog { flex-direction: row; } }

    .modal__close {
      position: absolute;
      top: .75rem;
      right: .75rem;
      z-index: 2;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      color: var(--slate-700);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 0 1px var(--slate-200), 0 2px 6px rgba(0, 0, 0, .15);
    }
    .modal__close:hover { background: #fff; }
    .modal__close:focus-visible { outline: 4px solid var(--indigo-400); outline-offset: 2px; }

    .modal__viewport {
      position: relative;
      flex: 0 0 18rem;
      width: 100%;
      background: var(--slate-900);
    }
    @media (min-width: 640px) { .modal__viewport { flex-basis: 24rem; } }
    @media (min-width: 1024px) {
      .modal__viewport { flex: 0 0 60%; width: 60%; min-height: 32rem; }
    }
    .modal__viewport iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .modal__noxr {
      height: 100%;
      min-height: 12rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      font-size: .875rem;
      color: #cbd5e1;
    }

    .modal__details {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 1.5rem;
    }
    @media (min-width: 640px) { .modal__details { padding: 2rem; } }

    .modal__title { margin: 0; padding-right: 2.5rem; font-size: 1.6rem; font-weight: 800; }
    .modal__tagline { margin: .3rem 0 0; font-size: 1rem; font-weight: 500; color: var(--indigo-600); }
    .modal__section { margin-top: 1.5rem; }
    .modal__section h3 {
      margin: 0;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--slate-500);
    }
    .modal__section p { margin: .5rem 0 0; line-height: 1.65; white-space: pre-line; color: var(--slate-700); }
    .modal__section--access {
      padding: 1rem;
      border-radius: 1rem;
      background: #ecfdf5;
      box-shadow: 0 0 0 1px #a7f3d0;
    }
    .modal__section--access h3 { color: #047857; }
    .modal__section--access p { color: #064e3b; }
    .modal__newtab {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: .875rem;
      font-weight: 600;
      color: var(--indigo-600);
    }

    @media (prefers-reduced-motion: reduce) {
      .carousel { scroll-behavior: auto; }
      .card, .card--skeleton { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main class="wall" aria-labelledby="c4a-wall-title">
    <header class="wall__header">
      <h1 class="wall__title" id="c4a-wall-title">City4All Accessible Wall</h1>
      <p class="wall__subtitle">Explore accessible businesses in immersive 3D. Tap a card to step inside.</p>
    </header>

    <div id="c4a-status" class="status" hidden></div>
    <div id="c4a-carousel" class="carousel" tabindex="0" aria-label="Accessible businesses carousel"></div>
    <noscript><p class="status status--error">JavaScript is required to display the Accessible Wall.</p></noscript>
  </main>

  <!-- Business details modal -->
  <div id="c4a-modal" class="modal" hidden>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="c4a-modal-title">
      <button type="button" id="c4a-close" class="modal__close" aria-label="Close details">&times;</button>

      <div class="modal__viewport">
        <iframe
          id="c4a-frame"
          title="Interactive 3D space"
          allow="xr-spatial-tracking; fullscreen; accelerometer; gyroscope; magnetometer; autoplay"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
          hidden></iframe>
        <div id="c4a-noxr" class="modal__noxr" hidden>The 3D space for this business isn't available yet.</div>
      </div>

      <div class="modal__details">
        <h2 id="c4a-modal-title" class="modal__title"></h2>
        <p id="c4a-modal-tagline" class="modal__tagline" hidden></p>

        <section id="c4a-about" class="modal__section" hidden>
          <h3>About</h3>
          <p id="c4a-about-text"></p>
        </section>

        <section id="c4a-access" class="modal__section modal__section--access" hidden>
          <h3><span aria-hidden="true">&#9855;</span> Accessibility details</h3>
          <p id="c4a-access-text"></p>
        </section>

        <a id="c4a-newtab" class="modal__newtab" target="_blank" rel="noopener noreferrer" hidden>Open 3D space in a new tab &#8599;</a>
      </div>
    </div>
  </div>

  <script src="wall.js?v=1" defer></script>
</body>
</html>
